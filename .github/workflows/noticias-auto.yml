name: Automatización de noticias

on:
  workflow_dispatch:

  schedule:
    # Ejecutar cada 2 horas
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: noticias-automaticas
  cancel-in-progress: false

jobs:
  actualizar-noticias:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Comprobar Python
        run: |
          python --version

      - name: Ejecutar automatización de noticias
        run: |
          python scripts/actualizar_noticias.py

      - name: Comprobar cambios
        run: |
          git status

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/noticias.json

          if git diff --cached --quiet; then
            echo "ℹ️ No hay noticias nuevas."
          else
            git commit -m "🤖 Actualizar noticias automáticamente"
            git push
          fi