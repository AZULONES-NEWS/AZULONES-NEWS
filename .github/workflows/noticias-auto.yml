name: Automatización de noticias

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  actualizar-noticias:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Mostrar estado
        run: |
          echo "🤖 Automatización de Azulones News"
          echo "📡 Comprobando noticias..."
          echo "📰 Archivo noticias.json encontrado"

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/noticias.json

          git diff --cached --quiet || git commit -m "🤖 Actualizar noticias automáticamente"

          git push